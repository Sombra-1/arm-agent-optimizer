name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Run release validation
        env:
          PYTHON_BIN: python
          PYTEST_BIN: pytest
          RUFF_BIN: ruff
          MYPY_BIN: mypy
          AARCHTUNE_BIN: aarchtune
        run: scripts/validate-release.sh
      - name: Scope note
        run: echo 'CI uses synthetic fixtures and does not validate real Arm performance.'
