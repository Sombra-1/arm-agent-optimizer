name: Native Arm64 Model Quality Precheck

on:
  workflow_dispatch:
    inputs:
      model_profile:
        description: Immutable model profile
        required: true
        type: choice
        default: qwen2.5-14b-q3-k-m
        options:
          - qwen2.5-14b-q3-k-m
          - qwen2.5-7b-q3-k-m
      output_contract:
        description: Output contract
        required: true
        type: choice
        default: prompt_only
        options:
          - prompt_only
          - json_object

permissions:
  contents: read

concurrency:
  group: native-arm64-quality-precheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-precheck:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LLAMA_REPOSITORY: https://github.com/ggml-org/llama.cpp.git
      LLAMA_RELEASE: b10106
      LLAMA_COMMIT: 1425386fd996511e1f3295e7366c38289a92a271
      MODEL_PROFILE: ${{ inputs.model_profile }}
      OUTPUT_CONTRACT: ${{ inputs.output_contract }}
      DISK_SAFETY_MARGIN_BYTES: "4294967296"
      ARTIFACT_NAME: aarchtune-arm64-quality-precheck-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLIC_EVIDENCE_SCAN_PATTERN: /home/runner/|/opt/hostedtoolcache/|/home/ayx/|/tmp/|Authorization:|Bearer[[:space:]]+[^<[:space:]][^[:space:]]*|ghp_|github_pat_|BEGIN OPENSSH PRIVATE KEY|BEGIN PRIVATE KEY|raw_response|raw-response|response_body
      HF_TOKEN_ASSIGNMENT_PATTERN: "HF_TOKEN[\"']?[[:space:]]*[:=][[:space:]]*[\"']?[^<\"'[:space:]][^\"'[:space:]]*"

    steps:
      - name: Check out AArchTune
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Initialize ephemeral paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "EVIDENCE_DIR=$RUNNER_TEMP/aarchtune-quality-precheck-evidence"
            echo "BASELINE_DIR=$RUNNER_TEMP/aarchtune-quality-precheck-baseline"
            echo "MODEL_DIR=$RUNNER_TEMP/aarchtune-quality-precheck-model"
            echo "MODEL_CACHE_DIR=$RUNNER_TEMP/aarchtune-quality-precheck-cache"
            echo "LLAMA_SOURCE_DIR=$RUNNER_TEMP/llama.cpp"
            echo "LLAMA_BUILD_DIR=$RUNNER_TEMP/llama.cpp-build"
            echo "HF_HOME=$RUNNER_TEMP/aarchtune-quality-precheck-cache/huggingface"
            echo "PRECHECK_STARTED_EPOCH=$(date +%s)"
            echo "PRECHECK_BLOCKED=false"
            echo "PRECHECK_OUTCOME=quality_evidence_incomplete"
          } >> "$GITHUB_ENV"

      - name: Prove native Arm64 and collect runner evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$EVIDENCE_DIR/runner" \
            "$EVIDENCE_DIR/llama-build" \
            "$EVIDENCE_DIR/checksums" \
            "$EVIDENCE_DIR/quality"
          architecture=$(uname -m)
          case "$architecture" in
            aarch64|arm64) ;;
            *)
              echo "Refusing non-native runner architecture: $architecture" >&2
              exit 1
              ;;
          esac
          uname -m > "$EVIDENCE_DIR/runner/uname-m.txt"
          lscpu > "$EVIDENCE_DIR/runner/lscpu.txt"
          nproc > "$EVIDENCE_DIR/runner/nproc.txt"
          free -b > "$EVIDENCE_DIR/runner/free-b.txt"
          cat > "$EVIDENCE_DIR/runner/classification.txt" <<'EOF'
          Native GitHub-hosted Linux Arm64 runner
          Not emulation
          Ephemeral shared validation environment
          Not a performance benchmark
          EOF

      - name: Install build dependencies and AArchTune
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            jq \
            ninja-build
          python -m pip install --upgrade pip
          python -m pip install -e .
          aarchtune baseline --help > /dev/null
          aarchtune baseline validate --help > /dev/null

      - name: Resolve allowlisted immutable model profile
        shell: bash
        run: |
          set -euo pipefail
          profile_environment="$RUNNER_TEMP/model-profile.env"
          python scripts/quality_precheck.py resolve-profile \
            --profile "$MODEL_PROFILE" > "$profile_environment"
          python scripts/quality_precheck.py resolve-contract \
            --contract "$OUTPUT_CONTRACT" >> "$profile_environment"
          cat "$profile_environment" >> "$GITHUB_ENV"
          source "$profile_environment"
          echo "MODEL_PATH=$MODEL_DIR/$MODEL_FILENAME" >> "$GITHUB_ENV"
          rm -f "$profile_environment"

      - name: Fetch pinned official llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LLAMA_SOURCE_DIR"
          git -C "$LLAMA_SOURCE_DIR" init
          git -C "$LLAMA_SOURCE_DIR" remote add upstream "$LLAMA_REPOSITORY"
          git -C "$LLAMA_SOURCE_DIR" fetch --depth 1 upstream "$LLAMA_COMMIT"
          git -C "$LLAMA_SOURCE_DIR" checkout --detach FETCH_HEAD
          actual_commit=$(git -C "$LLAMA_SOURCE_DIR" rev-parse HEAD)
          [[ "$actual_commit" == "$LLAMA_COMMIT" ]]
          tag_commit=$(
            git -C "$LLAMA_SOURCE_DIR" ls-remote \
              --exit-code --tags --refs upstream "refs/tags/$LLAMA_RELEASE" |
              awk '{print $1}'
          )
          [[ "$tag_commit" == "$LLAMA_COMMIT" ]]
          grep -q 'option(GGML_CPU_KLEIDIAI' "$LLAMA_SOURCE_DIR/ggml/CMakeLists.txt"
          grep -Rqs 'LLM_ARCH_QWEN2' "$LLAMA_SOURCE_DIR/src"
          if [[ "$OUTPUT_CONTRACT" == json_object ]]; then
            server_common="$LLAMA_SOURCE_DIR/tools/server/server-common.cpp"
            chat_source="$LLAMA_SOURCE_DIR/common/chat.cpp"
            grep -Fq 'if (response_type == "json_object")' "$server_common"
            grep -Fq 'json_schema = json_value(response_format, "schema", json::object());' \
              "$server_common"
            grep -Fq 'params.grammar = json_schema_to_grammar(json::parse(inputs.json_schema));' \
              "$chat_source"
            grep -Fq 'bool use_jinja = true;' "$LLAMA_SOURCE_DIR/common/common.h"
            grep -Fq 'POST `/v1/chat/completions`' "$LLAMA_SOURCE_DIR/tools/server/README.md"
            grep -Fq '({"type": "json_object"}, 10' \
              "$LLAMA_SOURCE_DIR/tools/server/tests/unit/test_chat_completion.py"
            {
              echo "source_commit=$LLAMA_COMMIT"
              echo "endpoint=/v1/chat/completions"
              echo "plain_json_object_recognized=true"
              echo "schema_required=false"
              echo "converted_to_json_grammar=true"
              echo "pinned_server_test_expected_status=http_200"
              echo "unsupported_signal=http_400_or_422"
              echo "jinja_flag_explicit=false"
              echo "jinja_effective_default=true"
            } > "$EVIDENCE_DIR/llama-build/response-format-compatibility.txt"
          fi
          {
            echo "upstream_repository=$LLAMA_REPOSITORY"
            echo "release=$LLAMA_RELEASE"
            echo "commit=$actual_commit"
          } > "$EVIDENCE_DIR/llama-build/source.txt"

      - name: Build only native quality-precheck binaries
        shell: bash
        run: |
          set -euo pipefail
          configuration=(
            cmake
            -S "$LLAMA_SOURCE_DIR"
            -B "$LLAMA_BUILD_DIR"
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DGGML_CPU=ON
            -DGGML_CPU_KLEIDIAI=ON
            -DGGML_NATIVE=ON
            -DGGML_CUDA=OFF
            -DGGML_VULKAN=OFF
            -DGGML_METAL=OFF
            -DGGML_RPC=OFF
            -DGGML_BUILD_TESTS=OFF
            -DGGML_BUILD_EXAMPLES=OFF
            -DLLAMA_BUILD_TESTS=OFF
            -DLLAMA_BUILD_EXAMPLES=OFF
            -DLLAMA_BUILD_TOOLS=ON
            -DLLAMA_BUILD_SERVER=ON
            -DLLAMA_BUILD_UI=OFF
            -DLLAMA_USE_PREBUILT_UI=OFF
            -DLLAMA_BUILD_APP=OFF
          )
          "${configuration[@]}" > "$RUNNER_TEMP/llama-cmake.log" 2>&1
          grep -Eq '^GGML_CPU_KLEIDIAI:BOOL=ON$' "$LLAMA_BUILD_DIR/CMakeCache.txt"
          grep -q 'GGML_USE_CPU_KLEIDIAI' "$LLAMA_BUILD_DIR/compile_commands.json"
          cmake --build "$LLAMA_BUILD_DIR" \
            --target llama-server llama-cli \
            --parallel "$(nproc)" > "$RUNNER_TEMP/llama-build.log" 2>&1
          for binary in llama-server llama-cli; do
            path="$LLAMA_BUILD_DIR/bin/$binary"
            [[ -x "$path" ]]
            "$path" --version > "$RUNNER_TEMP/$binary-version.txt" 2>&1
            grep -q "${LLAMA_COMMIT:0:7}" "$RUNNER_TEMP/$binary-version.txt"
          done
          (
            cd "$LLAMA_BUILD_DIR/bin"
            sha256sum llama-server llama-cli
          ) > "$EVIDENCE_DIR/llama-build/binaries.sha256"
          {
            echo "build_status=success"
            echo "kleidiai_build_enabled=true"
            echo "native_build=true"
            echo "built_targets=llama-server,llama-cli"
            echo "binary_verification=passed"
          } > "$EVIDENCE_DIR/llama-build/status.txt"

      - name: Validate workload and policy inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ $(grep -cve '^[[:space:]]*$' workloads/smoke-test.jsonl) -eq 5 ]]
          aarchtune workload validate workloads/smoke-test.jsonl --json > /dev/null
          sha256sum workloads/smoke-test.jsonl \
            > "$EVIDENCE_DIR/checksums/workload.sha256"
          sha256sum configs/default-quality-policy.yaml \
            > "$EVIDENCE_DIR/checksums/quality-policy.sha256"

      - name: Verify immutable model metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/model-metadata.json"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            --output "$metadata" \
            "https://huggingface.co/api/models/$MODEL_REPOSITORY/revision/$MODEL_REVISION?blobs=true"
          jq -e --arg revision "$MODEL_REVISION" '.sha == $revision' "$metadata"
          jq -e \
            --arg filename "$MODEL_FILENAME" \
            --arg sha256 "$MODEL_SHA256" \
            --argjson size "$MODEL_SIZE_BYTES" \
            '.siblings[] |
              select(.rfilename == $filename) |
              .size == $size and .lfs.size == $size and .lfs.sha256 == $sha256' \
            "$metadata"

      - name: Verify immutable license evidence
        shell: bash
        run: |
          set -euo pipefail
          license_source="$RUNNER_TEMP/model-license-evidence"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            --output "$license_source" \
            "$LICENSE_EVIDENCE_URL"
          python scripts/quality_precheck.py verify-license \
            --profile "$MODEL_PROFILE" \
            --path "$license_source" \
            > "$EVIDENCE_DIR/license-provenance.json"

      - name: Enforce temporary-disk safety margin
        shell: bash
        run: |
          set -euo pipefail
          disk_available_before=$(
            df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' '
          )
          system_ram_bytes=$(free -b | awk '/^Mem:/ {print $2}')
          ram_available_before=$(free -b | awk '/^Mem:/ {print $7}')
          disk_required_bytes=$((MODEL_SIZE_BYTES + DISK_SAFETY_MARGIN_BYTES))
          {
            echo "disk_available_before_download_bytes=$disk_available_before"
            echo "disk_required_bytes=$disk_required_bytes"
            echo "disk_safety_margin_bytes=$DISK_SAFETY_MARGIN_BYTES"
            echo "system_ram_bytes=$system_ram_bytes"
            echo "ram_available_before_download_bytes=$ram_available_before"
            echo "model_size_bytes=$MODEL_SIZE_BYTES"
          } > "$EVIDENCE_DIR/runner/resource-evidence.txt"
          if ((disk_available_before <= disk_required_bytes)); then
            {
              echo "probe_exit_code=not_run"
              echo "model_load_classification=resource_incompatible"
              echo "probe_status=resource_incompatible"
              echo "model_loaded=false"
              echo "cpu_inference=true"
              echo "n_gpu_layers=0"
              echo "generated_text_published=false"
              echo "kleidiai_runtime_evidence=unknown"
            } > "$EVIDENCE_DIR/model-load-status.txt"
            {
              echo "PRECHECK_BLOCKED=true"
              echo "PRECHECK_OUTCOME=resource_incompatible"
            } >> "$GITHUB_ENV"
          fi

      - name: Download and verify pinned model
        if: env.PRECHECK_BLOCKED == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR" "$MODEL_CACHE_DIR"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --output "$MODEL_PATH" \
            "$MODEL_URL"
          [[ -s "$MODEL_PATH" ]]
          python scripts/quality_precheck.py verify-model \
            --path "$MODEL_PATH" \
            --size "$MODEL_SIZE_BYTES" \
            --sha256 "$MODEL_SHA256" > "$RUNNER_TEMP/model-verification.json"
          [[ -f "$MODEL_PATH" ]]
          [[ $(basename "$MODEL_PATH") == "$MODEL_FILENAME" ]]
          grep -aFq 'general.architecture' "$MODEL_PATH"
          grep -aFq 'tokenizer.chat_template' "$MODEL_PATH"
          grep -aFq '<|im_start|>' "$MODEL_PATH"
          thinking_markers_present=false
          if grep -aFq '<think>' "$MODEL_PATH"; then
            thinking_markers_present=true
          fi
          disk_available_after=$(
            df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' '
          )
          ram_available_after=$(free -b | awk '/^Mem:/ {print $7}')
          {
            echo "disk_available_after_download_bytes=$disk_available_after"
            echo "ram_available_after_download_bytes=$ram_available_after"
          } >> "$EVIDENCE_DIR/runner/resource-evidence.txt"
          jq -n \
            --arg profile "$MODEL_PROFILE" \
            --arg repository "$MODEL_REPOSITORY" \
            --arg revision "$MODEL_REVISION" \
            --arg filename "$MODEL_FILENAME" \
            --arg quantization "$MODEL_QUANTIZATION" \
            --arg license "$MODEL_LICENSE" \
            --arg license_id "$MODEL_LICENSE_ID" \
            --arg license_repository "$LICENSE_REPOSITORY" \
            --arg license_revision "$LICENSE_REVISION" \
            --arg license_path "$LICENSE_PATH" \
            --arg license_evidence_sha256 "$LICENSE_EVIDENCE_SHA256" \
            --arg parameter_class "$MODEL_PARAMETER_CLASS" \
            --arg sha256 "$MODEL_SHA256" \
            --argjson thinking_markers_present "$thinking_markers_present" \
            --argjson size_bytes "$MODEL_SIZE_BYTES" \
            '{
              profile: $profile,
              repository: $repository,
              revision: $revision,
              filename: $filename,
              quantization: $quantization,
              license: $license,
              license_id: $license_id,
              license_repository: $license_repository,
              license_revision: $license_revision,
              license_path: $license_path,
              license_evidence_sha256: $license_evidence_sha256,
              license_verified: true,
              parameter_class: $parameter_class,
              size_bytes: $size_bytes,
              sha256: $sha256,
              native_chat_template_present: true,
              thinking_markers_present: $thinking_markers_present,
              verified: true
            }' > "$EVIDENCE_DIR/model-provenance.json"

      - name: Probe model loading on CPU
        if: env.PRECHECK_BLOCKED == 'false'
        shell: bash
        run: |
          set -euo pipefail
          probe_stdout="$RUNNER_TEMP/llama-cli-probe.stdout"
          probe_stderr="$RUNNER_TEMP/llama-cli-probe.stderr"
          setsid timeout --signal=TERM --kill-after=15s 600s \
            "$LLAMA_BUILD_DIR/bin/llama-cli" \
            --model "$MODEL_PATH" \
            --prompt 'Return only the word OK.' \
            --single-turn \
            --simple-io \
            --n-predict 8 \
            --seed 42 \
            --temp 0 \
            --n-gpu-layers 0 \
            > "$probe_stdout" 2> "$probe_stderr" &
          probe_pid=$!
          echo "$probe_pid" > "$RUNNER_TEMP/aarchtune-probe.pgid"
          set +e
          wait "$probe_pid"
          probe_exit=$?
          set -e
          echo "ram_available_before_probe_bytes=$(free -b | awk '/^Mem:/ {print $7}')" \
            >> "$EVIDENCE_DIR/runner/resource-evidence.txt"
          sed \
            -e "s#${RUNNER_TEMP}#\\$RUNNER_TEMP#g" \
            -e "s#${GITHUB_WORKSPACE}#\\$GITHUB_WORKSPACE#g" \
            "$probe_stderr" |
            grep -Ei \
              'CPU_KLEIDIAI|KleidiAI|load_backend|system_info|llama_model_loader|load_tensors|llama_context|load time|prompt eval|eval time' |
            head -200 > "$EVIDENCE_DIR/llama-build/runtime-provenance.txt" || true
          kleidiai_status=unknown
          if grep -Eiq \
            'CPU_KLEIDIAI|KleidiAI[^[:alnum:]]*(backend|enabled|active|loaded|in use|available)[^[:alnum:]]*(true|yes|on|1)?' \
            "$probe_stderr"; then
            kleidiai_status=verified
          fi
          probe_result="$RUNNER_TEMP/model-probe-classification.json"
          python scripts/quality_precheck.py classify-probe \
            --exit-code "$probe_exit" \
            --stderr "$probe_stderr" > "$probe_result"
          load_classification=$(jq -r '.classification' "$probe_result")
          precheck_outcome=$(jq -r '.outcome' "$probe_result")
          case "$load_classification" in
            model_loaded) probe_status=probe_passed ;;
            probe_timeout) probe_status=probe_timeout ;;
            resource_incompatible) probe_status=resource_incompatible ;;
            *) probe_status=process_failure ;;
          esac
          {
            echo "probe_exit_code=$probe_exit"
            echo "model_load_classification=$load_classification"
            echo "probe_status=$probe_status"
            echo "model_loaded=$([[ $load_classification == model_loaded ]] && echo true || echo false)"
            echo "cpu_inference=true"
            echo "n_gpu_layers=0"
            echo "generated_text_published=false"
            echo "kleidiai_runtime_evidence=$kleidiai_status"
          } > "$EVIDENCE_DIR/model-load-status.txt"
          echo "KLEIDIAI_RUNTIME_STATUS=$kleidiai_status" >> "$GITHUB_ENV"
          if [[ "$load_classification" != model_loaded ]]; then
            {
              echo "PRECHECK_BLOCKED=true"
              echo "PRECHECK_OUTCOME=$precheck_outcome"
            } >> "$GITHUB_ENV"
          fi

      - name: Run baseline quality only
        if: env.PRECHECK_BLOCKED == 'false'
        shell: bash
        run: |
          set -euo pipefail
          setsid aarchtune baseline \
            --binary "$LLAMA_BUILD_DIR/bin/llama-server" \
            --model "$MODEL_PATH" \
            --workload workloads/smoke-test.jsonl \
            --output-dir "$BASELINE_DIR" \
            --repetitions 2 \
            --warmup-requests 1 \
            --response-format "$RESPONSE_FORMAT_MODE" \
            --mmap \
            --request-timeout 60 \
            --startup-timeout 120 \
            --json \
            > "$RUNNER_TEMP/aarchtune-baseline.stdout" \
            2> "$RUNNER_TEMP/aarchtune-baseline.stderr" &
          baseline_pid=$!
          echo "$baseline_pid" > "$RUNNER_TEMP/aarchtune-baseline.pgid"
          set +e
          wait "$baseline_pid"
          baseline_exit=$?
          set -e
          echo "BASELINE_EXIT=$baseline_exit" >> "$GITHUB_ENV"
          [[ "$baseline_exit" -eq 0 ]]

      - name: Validate and sanitize baseline quality
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          quality_dir="$EVIDENCE_DIR/quality"
          mkdir -p "$quality_dir"
          if [[ "${PRECHECK_OUTCOME:-quality_evidence_incomplete}" == resource_incompatible ]]; then
            jq -n \
              --arg outcome resource_incompatible \
              --arg output_contract "$OUTPUT_CONTRACT" \
              --arg reason "Pinned model is incompatible with available runner resources" \
              '{
                outcome: $outcome,
                aggregate: null,
                output_contract: $output_contract,
                evidence_errors: [$reason],
                failed_policy_checks: []
              }' > "$quality_dir/quality-policy-outcome.json"
            printf '[]\n' > "$quality_dir/per-task-classifications.json"
          elif [[ -f "$BASELINE_DIR/failure.json" ]] \
            && jq -e '.error_type == "ResponseFormatUnsupportedError"' \
              "$BASELINE_DIR/failure.json" > /dev/null; then
            jq -n \
              --arg outcome response_format_unsupported \
              --arg output_contract "$OUTPUT_CONTRACT" \
              '{
                outcome: $outcome,
                aggregate: null,
                output_contract: $output_contract,
                response_format_applied: true,
                response_format_type: "json_object",
                evidence_errors: ["Pinned server rejected the selected response format"],
                failed_policy_checks: []
              }' > "$quality_dir/quality-policy-outcome.json"
            printf '[]\n' > "$quality_dir/per-task-classifications.json"
          elif [[ -f "$BASELINE_DIR/baseline-summary.json" \
                && -f "$BASELINE_DIR/manifest.json" \
                && -f "$BASELINE_DIR/raw-attempts.jsonl" ]]; then
            set +e
            python scripts/quality_precheck.py sanitize \
              --baseline-dir "$BASELINE_DIR" \
              --policy configs/default-quality-policy.yaml \
              --output-dir "$quality_dir" \
              --output-contract "$OUTPUT_CONTRACT" \
              > "$RUNNER_TEMP/quality-outcome.txt"
            sanitize_exit=$?
            set -e
            if [[ "$sanitize_exit" -ne 0 ]]; then
              rm -f "$quality_dir/"*.json
            fi
          fi
          if [[ ! -f "$quality_dir/quality-policy-outcome.json" ]]; then
            jq -n \
              --arg outcome "${PRECHECK_OUTCOME:-quality_evidence_incomplete}" \
              --arg output_contract "$OUTPUT_CONTRACT" \
              --arg reason "Baseline did not produce complete schema-valid evidence" \
              '{
                outcome: $outcome,
                aggregate: null,
                output_contract: $output_contract,
                evidence_errors: [$reason],
                failed_policy_checks: []
              }' > "$quality_dir/quality-policy-outcome.json"
            printf '[]\n' > "$quality_dir/per-task-classifications.json"
          fi

      - name: Prepare limitations statement
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/limitations-readme.txt" <<'EOF'
          This workflow evaluates model suitability only.
          It is not an AArchTune optimization or performance benchmark.
          It performs one fixed baseline-quality check on an ephemeral shared runner.
          Model weights, generated text, request bodies, server logs, and process streams are excluded.
          EOF

      - name: Clean up workflow-owned processes and sensitive evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_ok=true
          for pgid_file in \
            "$RUNNER_TEMP/aarchtune-probe.pgid" \
            "$RUNNER_TEMP/aarchtune-baseline.pgid"; do
            [[ -f "$pgid_file" ]] || continue
            pgid=$(<"$pgid_file")
            [[ "$pgid" =~ ^[0-9]+$ ]]
            if kill -0 -- "-$pgid" 2>/dev/null; then
              kill -TERM -- "-$pgid"
              for _ in {1..20}; do
                kill -0 -- "-$pgid" 2>/dev/null || break
                sleep 0.5
              done
            fi
            if kill -0 -- "-$pgid" 2>/dev/null; then
              kill -KILL -- "-$pgid"
            fi
            if ps -eo pgid= | awk -v owned="$pgid" '
              $1 == owned { found=1 }
              END { exit found ? 0 : 1 }
            '; then
              cleanup_ok=false
            fi
          done
          rm -f \
            "$RUNNER_TEMP/llama-cli-probe.stdout" \
            "$RUNNER_TEMP/llama-cli-probe.stderr" \
            "$RUNNER_TEMP/aarchtune-baseline.stdout" \
            "$RUNNER_TEMP/aarchtune-baseline.stderr" \
            "$RUNNER_TEMP/model-metadata.json" \
            "$RUNNER_TEMP/model-license-evidence" \
            "$RUNNER_TEMP/model-verification.json" \
            "$RUNNER_TEMP/model-probe-classification.json"
          find "$BASELINE_DIR" -type f -name 'server.log' -delete 2>/dev/null || true
          rm -rf "$BASELINE_DIR"
          rm -f "$MODEL_PATH"
          rm -rf "$MODEL_DIR" "$MODEL_CACHE_DIR"
          [[ ! -d "$BASELINE_DIR" ]]
          [[ ! -e "$MODEL_PATH" ]]
          [[ ! -d "$MODEL_CACHE_DIR" ]]
          [[ ! -e "$RUNNER_TEMP/model-license-evidence" ]]
          {
            echo "tracked_process_groups_stopped=$cleanup_ok"
            echo "samplers_stopped=$cleanup_ok"
            echo "model_deleted=true"
            echo "model_cache_deleted=true"
            echo "response_evidence_deleted=true"
            echo "probe_output_deleted=true"
            echo "temporary_server_logs_deleted=true"
            echo "license_evidence_source_deleted=true"
            echo "cleanup_complete=$cleanup_ok"
          } > "$EVIDENCE_DIR/cleanup-proof.txt"
          [[ "$cleanup_ok" == true ]]

      - name: Write summary and privacy-scan artifact
        id: privacy_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcome=$(
            jq -r '.outcome' "$EVIDENCE_DIR/quality/quality-policy-outcome.json"
          )
          ended_epoch=$(date +%s)
          duration_seconds=$((ended_epoch - PRECHECK_STARTED_EPOCH))
          python scripts/quality_precheck.py comparison \
            --profile "$MODEL_PROFILE" \
            --output-contract "$OUTPUT_CONTRACT" \
            --quality-outcome "$EVIDENCE_DIR/quality/quality-policy-outcome.json" \
            --output "$EVIDENCE_DIR/comparison-summary.json" \
            --duration-seconds "$duration_seconds"
          {
            echo "workflow=native-arm64-quality-precheck"
            echo "purpose=model_suitability_only"
            echo "native_architecture=$(cat "$EVIDENCE_DIR/runner/uname-m.txt" 2>/dev/null || echo unavailable)"
            echo "llama_cpp_release=$LLAMA_RELEASE"
            echo "llama_cpp_commit=$LLAMA_COMMIT"
            echo "model_profile=$MODEL_PROFILE"
            echo "output_contract=$OUTPUT_CONTRACT"
            echo "response_format_mode=$RESPONSE_FORMAT_MODE"
            echo "response_format_applied=$([[ $OUTPUT_CONTRACT == json_object ]] && echo true || echo false)"
            echo "response_format_type=$([[ $OUTPUT_CONTRACT == json_object ]] && echo json_object || echo none)"
            echo "model=$MODEL_REPOSITORY/$MODEL_FILENAME"
            echo "model_revision=$MODEL_REVISION"
            echo "model_quantization=$MODEL_QUANTIZATION"
            echo "model_parameter_class=$MODEL_PARAMETER_CLASS"
            echo "model_size_bytes=$MODEL_SIZE_BYTES"
            echo "model_sha256=$MODEL_SHA256"
            echo "model_license=$MODEL_LICENSE"
            echo "license_id=$MODEL_LICENSE_ID"
            echo "license_repository=$LICENSE_REPOSITORY"
            echo "license_revision=$LICENSE_REVISION"
            echo "license_path=$LICENSE_PATH"
            echo "license_evidence_sha256=$LICENSE_EVIDENCE_SHA256"
            echo "license_verified=true"
            echo "kleidiai_build_enabled=true"
            echo "kleidiai_runtime_evidence=${KLEIDIAI_RUNTIME_STATUS:-unknown}"
            echo "configured_attempts=10"
            echo "measured_attempts=$(jq -r '.aggregate.completed_attempts // 0' "$EVIDENCE_DIR/quality/quality-policy-outcome.json")"
            echo "warmup_requests=1"
            echo "quality_outcome=$outcome"
            echo "duration_seconds=$duration_seconds"
            echo "screening_executed=false"
            echo "optimization_executed=false"
          } > "$EVIDENCE_DIR/workflow-summary.txt"
          {
            echo "## Native Arm64 Model Quality Precheck"
            echo
            echo "**This workflow evaluates model suitability only.**"
            echo "It is not an AArchTune optimization or performance benchmark."
            echo
            echo "- Architecture: \`$(cat "$EVIDENCE_DIR/runner/uname-m.txt" 2>/dev/null || echo unavailable)\`"
            echo "- Model profile: \`$MODEL_PROFILE\`"
            echo "- Output contract: \`$OUTPUT_CONTRACT\`"
            echo "- Model: \`Qwen2.5-$MODEL_PARAMETER_CLASS-Instruct $MODEL_QUANTIZATION\`"
            echo "- Quality outcome: \`$outcome\`"
            echo "- Duration: \`$duration_seconds seconds\`"
            if [[ -f "$EVIDENCE_DIR/quality/validated-quality.json" ]]; then
              jq -r '
                "- Completed attempts: `" + (.completed_attempts | tostring) + "/" +
                  (.configured_attempts | tostring) + "`",
                "- Request success: `" + (.request_success_rate | tostring) + "`",
                "- Task success: `" + (.task_success_rate | tostring) + "`",
                "- JSON validity: `" + (.json_validity_rate | tostring) + "`",
                "- Validator pass rate: `" + (.validator_pass_rate | tostring) + "`",
                "- Timeout rate: `" + (.timeout_rate | tostring) + "`"
              ' "$EVIDENCE_DIR/quality/validated-quality.json"
            fi
            echo "- Screening executed: \`false\`"
            echo "- Optimization executed: \`false\`"
            echo "- Artifact: \`$ARTIFACT_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

          (
            cd "$EVIDENCE_DIR"
            find . -type f -printf '%P\n' | sort
          ) > "$EVIDENCE_DIR/artifact-inventory.txt"
          scan_results="$RUNNER_TEMP/aarchtune-quality-precheck-scan.txt"
          grep -RInE "$PUBLIC_EVIDENCE_SCAN_PATTERN" "$EVIDENCE_DIR" \
            > "$scan_results" || true
          grep -RInE "$HF_TOKEN_ASSIGNMENT_PATTERN" "$EVIDENCE_DIR" \
            >> "$scan_results" || true
          if [[ -s "$scan_results" ]]; then
            echo "Forbidden artifact content found:" >&2
            sed -n '1,200p' "$scan_results" >&2
            exit 1
          fi
          if find "$EVIDENCE_DIR" -type f \
            \( -name '*.gguf' -o -name 'raw-attempts.jsonl' \
               -o -name 'request-metrics.jsonl' -o -name 'process-samples.jsonl' \
               -o -name 'server.log' -o -name 'raw-response*' \
               -o -name '*stdout*' -o -name '*stderr*' \
               -o -name '.env' -o -name 'env.txt' -o -name 'env.json' \
               -o -name 'environment.txt' -o -name 'environment.json' \) |
            grep -q .; then
            echo "Forbidden model or runtime artifact found." >&2
            exit 1
          fi
          if grep -RInE \
            '"(response_text|server_fields|observed|expected)"' \
            "$EVIDENCE_DIR"; then
            echo "Response-derived fields found in public evidence." >&2
            exit 1
          fi
          {
            echo "privacy_scan_passed=true"
            echo "forbidden_content_matches=0"
            echo "private_path_matches=0"
          } > "$EVIDENCE_DIR/privacy-scan.txt"

      - name: Upload sanitized native Arm64 quality evidence
        if: always() && steps.privacy_scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

      - name: Preserve quality-precheck outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcome=$(
            jq -r '.outcome' "$EVIDENCE_DIR/quality/quality-policy-outcome.json"
          )
          case "$outcome" in
            quality_policy_passed|quality_policy_failed|quality_evidence_incomplete|resource_incompatible|response_format_unsupported) ;;
            *) exit 1 ;;
          esac
          [[ "$outcome" == "quality_policy_passed" ]]
